plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fongmi.android.tv'

    compileSdk 36
    signingConfigs {
        release {
            storeFile file("../keystore/release.jks")
            storePassword "xmbox123"
            keyAlias "xmbox"
            keyPassword "xmbox123"
            // 同时启用v1、v2、v3、v4签名以确保最佳兼容性
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
    }

    defaultConfig {
        applicationId "com.xybox.app"
        minSdk 24
        //noinspection ExpiredTargetSdkVersion
        targetSdk 28
        // versionName 带 -betaN 后缀时即为测试版，设置页会原样显示，用户一眼能看出装的是不是测试包。
        // versionCode 规则：(major*1000 + minor*100 + patch) * 10 + (beta 用序号 N，正式用 9)
        // 例：0.3.2-beta1=3021，0.3.2-beta2=3022，0.3.2 正式=3029，下一个 0.3.3-beta1=3031。
        // 正式版的尾数 9 保证它高于同版本的所有 beta，用户才能从 beta 直接覆盖安装到正式版。
        versionCode 30401
        versionName "0.3.4-beta1"
        ndk { abiFilters "arm64-v8a" }
        // GitHub Token (可选，用于提高API请求限制)
        def githubToken = project.findProperty("GITHUB_TOKEN") ?: ""
        buildConfigField "String", "GITHUB_TOKEN", "\"${githubToken}\""
        buildConfigField "String", "MODE", '"mobile"'
        buildConfigField "String", "ABI", '"arm64_v8a"'
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString(), "eventBusIndex": "com.fongmi.android.tv.event.EventIndex"]
            }
        }
    }

    sourceSets {
        debug {
            java.srcDir 'src/mobile/java'
            res.srcDir 'src/mobile/res'
        }
        release {
            java.srcDir 'src/mobile/java'
            res.srcDir 'src/mobile/res'
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        resources {
            exclude 'META-INF/beans.xml'
            exclude 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
        }
        jniLibs {
            // 解决重复的JNI库问题，只保留第一个找到的
            pickFirsts += [
                '**/libavcodec.so',
                '**/libavutil.so', 
                '**/libmedia3ext.so',
                '**/libquickjs-android-wrapper.so',
                '**/libswresample.so',
                '**/libswscale.so'
            ]
        }
    }

    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            outputFileName = "XYBox-${variant.buildType.name}.apk"
        }
    }

    configurations.configureEach {
        resolutionStrategy {
            force 'com.squareup.okhttp3:okhttp:' + okhttpVersion
        }
    }

    lint {
        disable 'UnsafeOptInUsageError'
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

