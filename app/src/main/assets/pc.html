<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XYBox 投屏</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; color: #eee;
               font: 14px/1.5 system-ui, "Microsoft YaHei", sans-serif; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  video { width: 100%; height: 100%; background: #000; }
  #idle { text-align: center; padding: 24px; }
  #idle h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
  #idle p { color: #999; margin: 4px 0; }
  #bar { position: fixed; left: 0; right: 0; top: 0; padding: 10px 14px;
         background: linear-gradient(#000c, #0000); display: flex; align-items: center;
         gap: 12px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #bar.show { opacity: 1; pointer-events: auto; }
  #title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { background: #ffffff1f; color: #eee; border: 0; border-radius: 6px;
           padding: 6px 12px; cursor: pointer; font-size: 13px; }
  button:hover { background: #ffffff33; }
  #tip { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%);
         background: #000c; padding: 8px 16px; border-radius: 6px; display: none; }
  #err { color: #ff8080; }
  #picker { position: fixed; inset: 0; background: #000000e0; padding: 56px 24px 24px;
            overflow-y: auto; display: none; }
  #picker.show { display: block; }
  #list { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  #list button { padding: 10px 8px; overflow: hidden; text-overflow: ellipsis;
                 white-space: nowrap; text-align: center; }
  #list button.on { background: #4a9eff; color: #fff; }
  #picker h2 { font-size: 15px; font-weight: 600; margin: 0 0 14px; color: #bbb; }
  #ver { position: fixed; right: 8px; bottom: 6px; font-size: 11px; color: #666;
         pointer-events: none; user-select: none; }
</style>
</head>
<body>

<div id="stage">
  <div id="idle">
    <h1>等待手机投屏</h1>
    <p>在手机上打开要看的剧集，点「投屏」，选择「电脑 / 浏览器」</p>
    <p id="err"></p>
  </div>
  <video id="v" playsinline controls style="display:none"></video>
</div>

<div id="bar">
  <span id="title"></span>
  <button id="pick" style="display:none">选集</button>
  <button id="copy">复制播放地址</button>
</div>

<div id="picker">
  <h2>选集（点击切换，电视/手机会一起跟着换）</h2>
  <div id="list"></div>
</div>

<div id="tip"></div>
<div id="ver">XYBox {{version}}</div>

<script src="/js/hls.min.js"></script>
<script>
// 浏览器在这里扮演渲染器：每秒拉一次手机的状态照做，同时把自己的实际进度报回去。
// 指令靠序号比对，所以重复拉取无副作用，刷新页面也能自己回到正确状态。
var v = document.getElementById('v');
var idle = document.getElementById('idle');
var bar = document.getElementById('bar');
var title = document.getElementById('title');
var tip = document.getElementById('tip');
var err = document.getElementById('err');
var picker = document.getElementById('picker');
var list = document.getElementById('list');
var pick = document.getElementById('pick');

var videoSeq = -1, seekSeq = -1, playSeq = -1, speedSeq = -1, episodeSeq = -1;
var current = '', hls = null, ended = false;
// 换源时先清空 <video>，个别浏览器会为此抛一次 error，别把它当成片源放不了
var ignoreErrorUntil = 0;

pick.onclick = function () { picker.classList.toggle('show'); };
picker.onclick = function (e) { if (e.target === picker) picker.classList.remove('show'); };
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') picker.classList.remove('show');
});

// 剧集列表整份重画，只在 episodeSeq 变化时做——每秒重建几十个按钮没必要，
// 还会把用户正在滚动的位置顶掉。
function drawEpisodes(names, index) {
  list.innerHTML = '';
  pick.style.display = names.length > 1 ? '' : 'none';
  names.forEach(function (name, i) {
    var b = document.createElement('button');
    b.textContent = name;
    b.title = name;
    if (i === index) b.className = 'on';
    b.onclick = function () {
      picker.classList.remove('show');
      toast('正在切到 ' + name);
      fetch('/pc/select?index=' + i, { cache: 'no-store' }).catch(function () {});
    };
    list.appendChild(b);
  });
}

// 出问题时的落脚点：启动打一行版本，每次换集打一行起播位置。
// 只留这两处，别让正式版往控制台刷屏。
function log() {
  var a = ['[XYBox]'].concat([].slice.call(arguments));
  console.log.apply(console, a);
}

log('页面已加载，版本 {{version}}。看不到这一行就说明浏览器用的是缓存里的旧页面。');

function toast(text) {
  tip.textContent = text;
  tip.style.display = 'block';
  setTimeout(function () { tip.style.display = 'none'; }, 2000);
}

document.getElementById('copy').onclick = function () {
  if (!current) return;
  // H.265 之类浏览器解不了的片源，把地址复制出去用 PotPlayer 放
  navigator.clipboard.writeText(current).then(function () {
    toast('已复制，可粘贴到 PotPlayer 播放');
  }, function () {
    prompt('复制这个地址到 PotPlayer 播放：', current);
  });
};

document.addEventListener('mousemove', function () {
  bar.classList.add('show');
  clearTimeout(bar._t);
  bar._t = setTimeout(function () {
    // 选集面板开着的时候别把顶栏藏了，那个「选集」按钮还要用来关它
    if (!picker.classList.contains('show')) bar.classList.remove('show');
  }, 2500);
});

function load(url, name, position) {
  current = url;
  ended = false;
  title.textContent = name || '';
  err.textContent = '';
  idle.style.display = 'none';
  v.style.display = 'block';
  log('LOAD 手机推来的起播位置 startPosition=' + position + 'ms（' + (position / 1000).toFixed(1) + 's）',
      '当前 currentTime=' + v.currentTime.toFixed(1) + 's', 'url=' + url);
  if (hls) { hls.destroy(); hls = null; }
  // 换集必须显式把播放位置清掉。hls.js 走的是 MSE，销毁重建时 <video> 元素的
  // currentTime 还留着上一集的值，新的一集会直接从那儿开播。
  ignoreErrorUntil = Date.now() + 1500;
  try {
    v.pause();
    v.removeAttribute('src');
    v.load();
    v.currentTime = 0;
  } catch (e) {}
  var start = position > 0 ? position / 1000 : 0;
  var isHls = url.indexOf('.m3u8') >= 0 || url.indexOf('.m3u') >= 0;
  // Safari 自己认 HLS，其余浏览器交给 hls.js；非 HLS 直接给 src
  if (isHls && window.Hls && Hls.isSupported()) {
    // startPosition 显式给定，不能指望它从元素当前时间推断
    hls = new Hls({ enableWorker: true, startPosition: start });
    hls.on(Hls.Events.ERROR, function (e, data) {
      if (data && data.fatal) fail('这个片源浏览器放不了，试试「复制播放地址」用 PotPlayer 打开');
    });
    hls.loadSource(url);
    hls.attachMedia(v);
  } else {
    v.src = url;
  }
  var seekOnce = function () {
    if (start > 0 && Math.abs(v.currentTime - start) > 1) {
      try { v.currentTime = start; } catch (e) {}
    }
    v.removeEventListener('loadedmetadata', seekOnce);
  };
  v.addEventListener('loadedmetadata', seekOnce);
  v.play().catch(function () {
    // 浏览器的自动播放限制：没交互过就放不了，提示点一下
    toast('点击画面开始播放');
  });
}

function applySpeed(speed) {
  var rate = speed || 1;
  try { v.defaultPlaybackRate = rate; v.playbackRate = rate; } catch (e) {}
}

function fail(text) {
  err.textContent = text;
  idle.style.display = 'block';
  v.style.display = 'none';
}

v.addEventListener('error', function () {
  if (Date.now() < ignoreErrorUntil) return;
  fail('这个片源浏览器放不了，试试「复制播放地址」用 PotPlayer 打开');
});

v.addEventListener('ended', function () { ended = true; });

function apply(s) {
  if (episodeSeq !== s.episodeSeq) {
    episodeSeq = s.episodeSeq;
    drawEpisodes(s.episodes || [], s.episodeIndex);
  }
  if (!s.casting) {
    if (videoSeq !== s.videoSeq) {
      videoSeq = s.videoSeq;
      if (hls) { hls.destroy(); hls = null; }
      v.pause();
      v.removeAttribute('src');
      v.style.display = 'none';
      idle.style.display = 'block';
      title.textContent = '';
      current = '';
    }
    return;
  }
  if (videoSeq !== s.videoSeq) {
    videoSeq = s.videoSeq;
    seekSeq = s.seekSeq;
    playSeq = s.playSeq;
    speedSeq = s.speedSeq;
    load(s.url, s.name, s.startPosition);
    // 必须放在 load 之后：里面的 v.load() 会按规范把 playbackRate 打回
    // defaultPlaybackRate，先设就白设了。两个都写，后面再 load 也不会丢。
    applySpeed(s.speed);
    return;
  }
  if (seekSeq !== s.seekSeq) {
    seekSeq = s.seekSeq;
    log('SEEK 手机要求跳到 ' + (s.seekTo / 1000).toFixed(1) + 's');
    try { v.currentTime = s.seekTo / 1000; } catch (e) {}
  }
  if (speedSeq !== s.speedSeq) {
    speedSeq = s.speedSeq;
    applySpeed(s.speed);
  }
  // 播放/暂停只在手机真的按了才动。无条件跟随会和用户在电脑上的操作打架：
  // 上报还没落地时状态里仍是旧值，页面就把自己扳回去了。
  if (playSeq !== s.playSeq) {
    playSeq = s.playSeq;
    if (s.playing) v.play().catch(function () {});
    else v.pause();
  }
}

function tick() {
  // 先报后取：本轮的实际状态先落到手机那边，紧接着拿回来的状态才是新的。
  // 反过来的话每次都在拿上一秒的旧值判断。
  var report = Promise.resolve();
  if (current) {
    var d = isFinite(v.duration) ? Math.round(v.duration * 1000) : 0;
    var p = Math.round(v.currentTime * 1000);
    report = fetch('/pc/report?position=' + p + '&duration=' + d +
          '&playing=' + (v.paused ? 0 : 1) + '&ended=' + (ended ? 1 : 0),
          { cache: 'no-store' }).catch(function () {});
  }
  report.then(function () {
    return fetch('/pc/state', { cache: 'no-store' });
  }).then(function (r) { return r.json(); })
    .then(apply)
    .catch(function () {});
}

setInterval(tick, 1000);
tick();
</script>
</body>
</html>
