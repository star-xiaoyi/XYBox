<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XYBox 投屏</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; color: #eee;
               font: 14px/1.5 system-ui, "Microsoft YaHei", sans-serif; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  video { width: 100%; height: 100%; background: #000; }
  #idle { text-align: center; padding: 24px; }
  #idle h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
  #idle p { color: #999; margin: 4px 0; }
  #bar { position: fixed; left: 0; right: 0; top: 0; padding: 10px 14px;
         background: linear-gradient(#000c, #0000); display: flex; align-items: center;
         gap: 12px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #bar.show { opacity: 1; pointer-events: auto; }
  #title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { background: #ffffff1f; color: #eee; border: 0; border-radius: 6px;
           padding: 6px 12px; cursor: pointer; font-size: 13px; }
  button:hover { background: #ffffff33; }
  #tip { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%);
         background: #000c; padding: 8px 16px; border-radius: 6px; display: none; }
  #err { color: #ff8080; }
</style>
</head>
<body>

<div id="stage">
  <div id="idle">
    <h1>等待手机投屏</h1>
    <p>在手机上打开要看的剧集，点「投屏」，选择「电脑 / 浏览器」</p>
    <p id="err"></p>
  </div>
  <video id="v" playsinline controls style="display:none"></video>
</div>

<div id="bar">
  <span id="title"></span>
  <button id="copy">复制播放地址</button>
</div>

<div id="tip"></div>

<script src="/js/hls.min.js"></script>
<script>
// 浏览器在这里扮演渲染器：每秒拉一次手机的状态照做，同时把自己的实际进度报回去。
// 指令靠序号比对，所以重复拉取无副作用，刷新页面也能自己回到正确状态。
var v = document.getElementById('v');
var idle = document.getElementById('idle');
var bar = document.getElementById('bar');
var title = document.getElementById('title');
var tip = document.getElementById('tip');
var err = document.getElementById('err');

var videoSeq = -1, seekSeq = -1, playSeq = -1, speedSeq = -1, current = '', hls = null, ended = false;

function toast(text) {
  tip.textContent = text;
  tip.style.display = 'block';
  setTimeout(function () { tip.style.display = 'none'; }, 2000);
}

document.getElementById('copy').onclick = function () {
  if (!current) return;
  // H.265 之类浏览器解不了的片源，把地址复制出去用 PotPlayer 放
  navigator.clipboard.writeText(current).then(function () {
    toast('已复制，可粘贴到 PotPlayer 播放');
  }, function () {
    prompt('复制这个地址到 PotPlayer 播放：', current);
  });
};

document.addEventListener('mousemove', function () {
  bar.classList.add('show');
  clearTimeout(bar._t);
  bar._t = setTimeout(function () { bar.classList.remove('show'); }, 2500);
});

function load(url, name, position) {
  current = url;
  ended = false;
  title.textContent = name || '';
  err.textContent = '';
  idle.style.display = 'none';
  v.style.display = 'block';
  if (hls) { hls.destroy(); hls = null; }
  var isHls = url.indexOf('.m3u8') >= 0 || url.indexOf('.m3u') >= 0;
  // Safari 自己认 HLS，其余浏览器交给 hls.js；非 HLS 直接给 src
  if (isHls && window.Hls && Hls.isSupported()) {
    hls = new Hls({ enableWorker: true });
    hls.on(Hls.Events.ERROR, function (e, data) {
      if (data && data.fatal) fail('这个片源浏览器放不了，试试「复制播放地址」用 PotPlayer 打开');
    });
    hls.loadSource(url);
    hls.attachMedia(v);
  } else {
    v.src = url;
  }
  var seekOnce = function () {
    if (position > 0) { try { v.currentTime = position / 1000; } catch (e) {} }
    v.removeEventListener('loadedmetadata', seekOnce);
  };
  v.addEventListener('loadedmetadata', seekOnce);
  v.play().catch(function () {
    // 浏览器的自动播放限制：没交互过就放不了，提示点一下
    toast('点击画面开始播放');
  });
}

function fail(text) {
  err.textContent = text;
  idle.style.display = 'block';
  v.style.display = 'none';
}

v.addEventListener('error', function () {
  fail('这个片源浏览器放不了，试试「复制播放地址」用 PotPlayer 打开');
});

v.addEventListener('ended', function () { ended = true; });

function apply(s) {
  if (!s.casting) {
    if (videoSeq !== s.videoSeq) {
      videoSeq = s.videoSeq;
      if (hls) { hls.destroy(); hls = null; }
      v.pause();
      v.removeAttribute('src');
      v.style.display = 'none';
      idle.style.display = 'block';
      title.textContent = '';
      current = '';
    }
    return;
  }
  if (videoSeq !== s.videoSeq) {
    videoSeq = s.videoSeq;
    seekSeq = s.seekSeq;
    playSeq = s.playSeq;
    speedSeq = s.speedSeq;
    v.playbackRate = s.speed || 1;
    load(s.url, s.name, s.startPosition);
    return;
  }
  if (seekSeq !== s.seekSeq) {
    seekSeq = s.seekSeq;
    try { v.currentTime = s.seekTo / 1000; } catch (e) {}
  }
  if (speedSeq !== s.speedSeq) {
    speedSeq = s.speedSeq;
    try { v.playbackRate = s.speed || 1; } catch (e) {}
  }
  // 播放/暂停只在手机真的按了才动。无条件跟随会和用户在电脑上的操作打架：
  // 上报还没落地时状态里仍是旧值，页面就把自己扳回去了。
  if (playSeq !== s.playSeq) {
    playSeq = s.playSeq;
    if (s.playing) v.play().catch(function () {});
    else v.pause();
  }
}

function tick() {
  // 先报后取：本轮的实际状态先落到手机那边，紧接着拿回来的状态才是新的。
  // 反过来的话每次都在拿上一秒的旧值判断。
  var report = Promise.resolve();
  if (current) {
    var d = isFinite(v.duration) ? Math.round(v.duration * 1000) : 0;
    var p = Math.round(v.currentTime * 1000);
    report = fetch('/pc/report?position=' + p + '&duration=' + d +
          '&playing=' + (v.paused ? 0 : 1) + '&ended=' + (ended ? 1 : 0),
          { cache: 'no-store' }).catch(function () {});
  }
  report.then(function () {
    return fetch('/pc/state', { cache: 'no-store' });
  }).then(function (r) { return r.json(); })
    .then(apply)
    .catch(function () {});
}

setInterval(tick, 1000);
tick();
</script>
</body>
</html>
